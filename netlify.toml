# Netlify sozlamasi — hech narsani o'zgartirish shart emas
[build]
  publish = "public"
  edge_functions = "netlify/edge-functions"

# 3D modellar: to'g'ri turi va brauzerda 1 hafta keshlanadi (qayta yuklanmaydi)
[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
