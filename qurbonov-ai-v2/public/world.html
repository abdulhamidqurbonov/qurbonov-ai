<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shinobu olami</title>
<meta name="theme-color" content="#0b0c0f">
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c0f; --panel: rgba(16,18,24,.94); --raise: #1a1e27; --line: #2a2f3a; --text: #ece8e1; --dim: #9aa0aa; --faint: #5f6570;
  --acc: #f4b544; --acc2: #ea6b3c; --ok: #4fd18b; --bad: #ff7a6b;
  font-family: 'Manrope', system-ui, sans-serif; color: var(--text);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #8fc46a; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#cv.drag { cursor: grabbing; }
#cv.place { cursor: crosshair; }

.hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.back { color: var(--text); width: 40px; height: 40px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.res { display: flex; gap: 6px; flex-wrap: wrap; }
.r { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: 14px; min-width: 86px; }
.r i { width: 20px; height: 20px; display: grid; place-items: center; } .r i svg { width: 100%; height: 100%; }
.r small { color: var(--faint); font-weight: 600; font-size: 11px; }
.r.full b { color: var(--acc); }
.hud .sp { flex: 1; }
.lvl { height: 36px; padding: 0 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); }
.lvl b { color: var(--text); }

.bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
.bar button { height: 48px; padding: 0 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.bar button.main { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #1a1206; border: 0; }
.bar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.panel { position: fixed; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 60px); transform: translateX(-50%); width: min(560px, calc(100vw - 20px));
  max-height: min(56vh, 460px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; z-index: 6;
  box-shadow: 0 20px 50px rgba(0,0,0,.5); backdrop-filter: blur(10px); animation: pin .18s ease-out; }
@keyframes pin { from { opacity: 0; transform: translate(-50%, 8px); } }
.panel h3 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.panel h3 .x { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { text-align: left; padding: 10px; border-radius: 13px; background: var(--raise); border: 1px solid transparent; display: grid; grid-template-columns: 46px 1fr; gap: 4px 10px; align-items: center; }
.card:hover:not(:disabled) { border-color: var(--acc); }
.card:disabled { opacity: .45; cursor: not-allowed; }
.card canvas { grid-row: span 2; width: 46px; height: 46px; }
.card b { font-size: 13.5px; } .card small { font-size: 11px; color: var(--dim); line-height: 1.35; }
.cost { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; font-weight: 700; grid-column: 1 / -1; margin-top: 2px; }
.cost span { display: flex; align-items: center; gap: 3px; } .cost svg { width: 14px; height: 14px; }
.cost .no { color: var(--bad); }
.info p { font-size: 13px; color: var(--dim); margin-bottom: 8px; line-height: 1.5; }
.info .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { height: 40px; padding: 0 14px; border-radius: 11px; background: var(--raise); border: 1px solid var(--line); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn.pri { background: var(--acc); color: #1a1206; border: 0; } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--bad); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: rgba(244,181,68,.15); color: var(--acc); font-size: 11px; font-weight: 700; margin-left: 4px; }

.hint { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 13px; z-index: 6; display: flex; gap: 10px; align-items: center; }
.hint[hidden] { display: none; }
.toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-size: 13.5px; z-index: 9; animation: pin .2s; max-width: calc(100vw - 30px); text-align: center; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; padding: 16px; }
.modal .box { background: #12151b; border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: min(400px, 100%); text-align: center; }
.modal h2 { font-size: 18px; margin-bottom: 8px; } .modal p { color: var(--dim); font-size: 13.5px; line-height: 1.55; margin-bottom: 12px; }
.modal .gain { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0 16px; font-weight: 800; }
.modal .gain span { display: flex; align-items: center; gap: 5px; } .modal .gain svg { width: 20px; height: 20px; }
.bar button[hidden] { display: none; }
.bar em { font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; }
.bar em[hidden] { display: none; }
.xp { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: #2a2f3a; overflow: hidden; vertical-align: middle; margin: 0 4px; }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc2), var(--acc)); }
.unit { grid-row: span 2; width: 46px; height: 46px; border-radius: 12px; background: radial-gradient(circle at 50% 30%, #f6d7c3 0 16%, transparent 17%), linear-gradient(var(--c), var(--c)) 50% 72% / 40% 38% no-repeat, #232836; }
.quests { display: grid; gap: 8px; }
.quest { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 13px; background: var(--raise); border: 1px solid transparent; }
.quest.ok { border-color: var(--ok); }
.quest b { font-size: 13.5px; } .quest small { font-size: 11px; color: var(--dim); }
.qbar { height: 6px; border-radius: 4px; background: #2a2f3a; margin: 6px 0 3px; overflow: hidden; } .qbar i { display: block; height: 100%; background: var(--ok); }
.qr { display: flex; gap: 6px; font-size: 12px; font-weight: 800; flex-wrap: wrap; justify-content: flex-end; max-width: 150px; } .qr span { display: flex; align-items: center; gap: 2px; } .qr svg { width: 14px; height: 14px; }
@media (max-width: 640px) { .bar button:not(.main) span { display: none; } .bar button:not(.main) { padding: 0 12px; } .quest { grid-template-columns: 1fr auto; } .qr { grid-column: 1 / -1; justify-content: flex-start; max-width: none; } .bar { gap: 5px; } }
@media (max-width: 640px) { .r { min-width: 0; padding: 0 9px 0 6px; font-size: 12.5px; height: 32px; } .r small { display: none; } .lvl { display: none; } .bar button { padding: 0 13px; height: 44px; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <a class="back" href="/" title="Chatga qaytish"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="res" id="res"></div>
  <div class="sp"></div>
  <div class="lvl" id="lvl"></div>
</div>
<div class="hint" id="hint" hidden><span id="hintText"></span><button class="btn" id="hintX">Bekor</button></div>
<div class="bar">
  <button class="main" id="buildBtn"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>Qurish</button>
  <button id="armyBtn" hidden><svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg><span>Qo'shin</span></button>
  <button id="guildBtn" hidden><svg viewBox="0 0 24 24"><path d="M4 4h16v13H7l-3 3zM8 9h8M8 13h5"/></svg><span>Gildiya</span><em hidden></em></button>
  <button id="feedBtn"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4"/></svg><span>Ovqatlantirish</span></button>
  <button id="voiceBtn" title="Ovoz"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6"/></svg></button>
</div>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
<script type="module" src="/world.js"></script>
<script type="module" src="/world3d.js"></script>
</body>
</html>
